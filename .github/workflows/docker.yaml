name: build docker

on:
  workflow_dispatch:
    inputs:
      git_tag:
        description: Git tag to build, for example v5.0.0
        required: true
        type: string
      image_repository:
        description: Docker image repository
        required: true
        default: reg.vesoft-inc.com/cloud-dev/nebula-stats-exporter
        type: string
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  docker:
    name: build docker image
    runs-on: [self-hosted, nebula-fast]
    container:
      image: reg.vesoft-inc.com/ci/ubuntu:20.04-docker
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    steps:
      - uses: webiny/action-post-run@3.0.0
        with:
          run: sh -c "find . -mindepth 1 -delete"

      - name: Prepare image metadata
        id: image
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_GIT_TAG: ${{ inputs.git_tag }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          GITHUB_REF_NAME_VALUE: ${{ github.ref_name }}
          INPUT_IMAGE_REPOSITORY: ${{ inputs.image_repository }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            git_tag="${INPUT_GIT_TAG}"
            git_ref="refs/tags/${git_tag}"
            image_repository="${INPUT_IMAGE_REPOSITORY}"
          else
            git_tag="${GITHUB_REF_NAME_VALUE}"
            git_ref="${GITHUB_REF_VALUE}"
            image_repository="reg.vesoft-inc.com/cloud-dev/nebula-stats-exporter"
          fi

          if [[ ! "${git_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "Invalid Git tag: ${git_tag}" >&2
            exit 1
          fi

          image_tag="${git_tag#v}"

          if [[ ! "${image_tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag: ${image_tag}" >&2
            exit 1
          fi

          echo "git_ref=${git_ref}" >> "${GITHUB_OUTPUT}"
          echo "repository=${image_repository}" >> "${GITHUB_OUTPUT}"
          echo "tag=${image_tag}" >> "${GITHUB_OUTPUT}"

      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.image.outputs.git_ref }}
          fetch-depth: 0

      - name: Set up go environment
        uses: actions/setup-go@v5
        with:
          go-version: 1.19

      - name: Configure git and go
        run: |
          go env -w GOFLAGS=-buildvcs=false
          git config --global --add safe.directory "$(pwd)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and Push Docker images
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker_repo="${IMAGE_REPOSITORY%/nebula-stats-exporter}"

          make image-multiarch \
            DOCKER_REPO="${docker_repo}" \
            IMAGE_REPOSITORY="${IMAGE_REPOSITORY}" \
            IMAGE_TAG="${IMAGE_TAG}"
